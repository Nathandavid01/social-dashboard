name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Video publication preflight tests
        run: python3 -m unittest discover -s tools/nate-video-review -p "test_*.py"
      - run: npm ci
      - name: Unit tests
        run: npm test -- --exclude '**/.claude/**' --exclude '**/*.live.test.ts'
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Smoke /pool
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: npm run smoke:pool

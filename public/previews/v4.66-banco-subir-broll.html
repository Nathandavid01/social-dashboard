<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nate Media · Banco subir y B-roll</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0b0b0b;color:#eee;font:14px/1.45 system-ui,sans-serif}
  main{max-width:720px;margin:0 auto;padding:24px}
  h1{margin:0 0 6px}
  .sub{color:#888;margin:0 0 18px}
  .go{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-size:12px;font-weight:650;background:#e9b622;color:#111}
  .ghost{background:#1a1a1a;color:#ccc;border:1px solid #333}
  .rail{border:1px solid #2a2a2a;border-radius:16px;background:#141414;overflow:hidden}
  .head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #2a2a2a}
  .broll{padding:12px 14px;border-top:1px solid #2a2a2a}
  .broll h3{margin:0 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#888}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style>
<main>
  <p class="sub">Nate Media · v4.66</p>
  <h1>Banco de Video</h1>
  <p class="sub">Sube crudos sin grabación. El B-roll del cliente se queda.</p>
  <p><button class="go">Subir videos</button></p>
  <article class="rail">
    <div class="head"><strong>ARASIBO</strong><span>2</span></div>
    <div class="broll">
      <div class="row">
        <div>
          <h3>B-roll del cliente</h3>
          <p class="sub" style="margin:0">Siempre aquí. No se va cuando publicas un video.</p>
        </div>
        <button class="go ghost">Subir B-roll</button>
      </div>
    </div>
  </article>
</main>
</html>
